name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest --cov=quant_execution --cov-branch --cov-report=term-missing -q
      - name: Enforce core branch coverage
        shell: bash
        run: |
          for module in engine matching state_machine ledger rules; do
            python -m coverage report --include="*/${module}.py" --fail-under=90
          done
