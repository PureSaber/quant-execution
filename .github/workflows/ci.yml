name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests benchmarks
      - run: python -m ruff format --check src tests benchmarks
      - run: python -m pytest --cov=quant_execution --cov-branch --cov-report=term-missing --cov-report=json:coverage.json -q
      - run: python -m coverage report --fail-under=80
      - name: Enforce core branch coverage
        run: >-
          python tools/check_branch_coverage.py coverage.json --threshold 90
          broker contracts schemas engine matching state_machine ledger rules
