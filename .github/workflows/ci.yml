name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check
      - run: python -m ruff check src tests benchmarks tools
      - run: python -m ruff format --check src tests benchmarks tools
      - run: python -m pytest --cov=quant_execution --cov-branch --cov-report=term-missing --cov-report=json:coverage.json -q
      - run: python -m coverage report --fail-under=80
      - name: Enforce core branch coverage
        run: >-
          python tools/check_branch_coverage.py coverage.json --threshold 90
          artifacts broker contracts schemas engine matching state_machine ledger rules dividends
