[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-execution"
version = "0.1.0"
description = "Deterministic execution and ledger contracts for PureSaber quant research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0",
    "jsonschema>=4.20",
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@v0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../quant-data-kit/src"]

[tool.ruff]
line-length = 100
target-version = "py310"
